name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build and test packages
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"

      - name: Toolchain
        run: |
          swift --version
          xcrun swift-format --version

      - name: Install SwiftLint and XcodeGen
        run: brew install swiftlint xcodegen

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            Packages/StudyBotCore/.build
            Packages/StudyBotKit/.build
            Packages/StudyBotUI/.build
            Server/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'Server/Package.swift', 'Server/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Format check (blocking)
        run: xcrun swift-format lint --strict --recursive Packages Apps Server/Sources Server/Tests

      - name: SwiftLint (blocking)
        run: swiftlint --strict

      - name: Build and test StudyBotCore
        working-directory: Packages/StudyBotCore
        run: swift test

      - name: Build and test StudyBotKit
        working-directory: Packages/StudyBotKit
        # Serial: SwiftData on the macOS 15 runner has crashed (signal 11, "model is still
        # editable") when several in-memory containers are created from parallel tests.
        run: swift test --no-parallel

      - name: Build and test StudyBotUI
        working-directory: Packages/StudyBotUI
        run: swift test

      - name: Build and test the server
        working-directory: Server
        run: swift test

      - name: Generate the Xcode project
        run: xcodegen generate --quiet

      - name: Build the Mac app
        run: |
          xcodebuild -project StudyBot.xcodeproj -scheme StudyBotMac -configuration Debug \
            -derivedDataPath .build/DerivedData CODE_SIGN_IDENTITY=- build -quiet
