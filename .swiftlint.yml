# SwiftLint — blocking in CI (spec §3.12). Conventions from §3.13.
included:
  - Packages
excluded:
  - "**/.build"
  - "**/Package.swift"

opt_in_rules:
  - force_unwrapping          # §3.13: no force unwraps outside tests
  - implicitly_unwrapped_optional
  - todo                      # every TODO carries a date and a name; the rule keeps them visible
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - trailing_comma            # swift-format owns formatting
  - opening_brace
  - line_length               # swift-format enforces 110

force_try:
  severity: error
force_unwrapping:
  severity: error
force_cast:
  severity: error

identifier_name:
  min_length: 2
  excluded: [id, x, y, at, to, of, y1]

type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 900
function_body_length:
  warning: 80
  error: 120

custom_rules:
  # §3.13: "Every TODO carries a date and a name."
  dated_todo:
    name: "Dated TODO"
    regex: "(TODO|FIXME)(?!\\(\\d{4}-\\d{2}-\\d{2}, [A-Za-z]+\\))"
    match_kinds: comment
    message: "Write TODOs as TODO(2026-09-14, alvis): …"
    severity: error
